<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGIC GOAT STUDIO // COMMAND PORTAL</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #060a0c;
      --panel-alt: #030608;
      --border: #123640;
      --border-bright: #1e5766;
      --cyan: #00f3ff;
      --green: #39ff14;
      --amber: #ff9e00;
      --red: #ff3b3b;
      --muted: #6c8b94;
      --text: #d7f7ff;
      --topbar-h: 54px;
      --sidebar-w: 255px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 60% 0%, rgba(0, 243, 255, 0.07), transparent 65%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.014) 0px,
          rgba(255, 255, 255, 0.014) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    /* ================= TOP BAR ================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--topbar-h);
      background: #04080a;
      border-bottom: 1px solid var(--border-bright);
      box-shadow: 0 2px 18px rgba(0, 243, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 12px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle {
      display: none;
      background: #020506;
      color: var(--cyan);
      border: 1px solid var(--border-bright);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--cyan);
      font-weight: bold;
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .pulse {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.6s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }

    .build-pill {
      border: 1px solid rgba(255, 158, 0, 0.45);
      background: rgba(255, 158, 0, 0.07);
      color: var(--amber);
      padding: 3px 8px;
      letter-spacing: 0.05em;
    }

    .sys-pill {
      border: 1px solid rgba(57, 255, 20, 0.4);
      background: rgba(57, 255, 20, 0.06);
      color: var(--green);
      padding: 3px 8px;
      letter-spacing: 0.06em;
    }

    /* ================= SHELL LAYOUT ================= */
    .shell {
      display: flex;
      flex: 1;
      min-height: calc(100vh - var(--topbar-h));
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel-alt);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .side-group {
      margin-bottom: 20px;
    }

    .side-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--amber);
      padding: 0 8px 8px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 8px;
    }

    .side-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .side-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.84rem;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .side-link:hover {
      background: rgba(0, 243, 255, 0.09);
      border-color: var(--border-bright);
      color: var(--cyan);
    }

    .side-link.active {
      background: rgba(0, 243, 255, 0.14);
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: bold;
    }

    .side-badge {
      font-size: 0.68rem;
      padding: 1px 5px;
      border: 1px solid var(--green);
      color: var(--green);
      text-transform: uppercase;
    }

    .side-badge.amber {
      border-color: var(--amber);
      color: var(--amber);
    }

    .side-badge.muted {
      border-color: var(--muted);
      color: var(--muted);
    }

    .side-telemetry {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 12px;
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .side-telemetry strong {
      color: var(--cyan);
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .side-telemetry span {
      color: var(--green);
    }

    .side-telemetry span.amber {
      color: var(--amber);
    }

    /* ================= MAIN WORKSPACE ================= */
    .main-area {
      flex: 1;
      min-width: 0;
      padding: 24px 24px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .content-wrap {
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
    }

    /* Welcome Hero Box */
    .welcome-panel {
      border: 1px solid var(--border-bright);
      background: var(--panel);
      padding: 22px 24px;
      margin-bottom: 28px;
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.08);
      position: relative;
    }

    .welcome-top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .welcome-kicker {
      font-size: 0.78rem;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .welcome-build-tag {
      font-size: 0.76rem;
      color: var(--amber);
      letter-spacing: 0.06em;
    }

    .welcome-panel h1 {
      font-size: clamp(1.5rem, 3.4vw, 2.2rem);
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .welcome-text {
      color: var(--text);
      font-size: 0.92rem;
      line-height: 1.65;
      max-width: 820px;
      margin-bottom: 16px;
    }

    .welcome-text em {
      color: var(--amber);
      font-style: normal;
    }

    .welcome-actions {
      display
