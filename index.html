        label: '&Help',
        items: [
          { label: 'About Calculator...', action: () => showAboutDialog('Calculator') }
        ]
      }
    ],
    render: (container) => {
      function updateDisp() {
        const dEl = container.querySelector('#calc-disp');
        if (dEl) dEl.textContent = display;
        const mEl = container.querySelector('#calc-mem-ind');
        if (mEl) mEl.textContent = memory !== 0 ? 'M' : '';
      }

      function pressKey(k) {
        if (/^[0-9]$/.test(k)) {
          if (display === '0' || resetNext) {
            display = k;
            resetNext = false;
          } else if (display.length < 14) {
            display += k;
          }
        } else if (k === '.') {
          if (resetNext) { display = '0.'; resetNext = false; }
          else if (!display.includes('.')) display += '.';
        } else if (k === 'C') {
          display = '0'; prevVal = null; op = null; resetNext = false;
        } else if (k === 'CE') {
          display = '0';
        } else if (k === 'Back') {
          display = display.length > 1 ? display.slice(0, -1) : '0';
        } else if (k === '+/-') {
          display = String(-parseFloat(display));
        } else if (k === 'sqrt') {
          const v = parseFloat(display);
          display = v < 0 ? 'Error' : String(Math.sqrt(v));
          resetNext = true;
        } else if (k === '1/x') {
          const v = parseFloat(display);
          display = v === 0 ? 'Cannot divide by zero' : String(1 / v);
          resetNext = true;
        } else if (k === '%') {
          if (prevVal !== null) {
            display = String((prevVal * parseFloat(display)) / 100);
          }
        } else if (['+', '-', '*', '/'].includes(k)) {
          if (op && !resetNext) calculate();
          prevVal = parseFloat(display);
          op = k;
          resetNext = true;
        } else if (k === '=') {
          calculate();
          op = null;
          resetNext = true;
        } else if (k === 'MC') { memory = 0; }
        else if (k === 'MR') { display = String(memory); resetNext = true; }
        else if (k === 'MS') { memory = parseFloat(display) || 0; resetNext = true; }
        else if (k === 'M+') { memory += parseFloat(display) || 0; resetNext = true; }

        updateDisp();
      }

      function calculate() {
        if (prevVal === null || !op) return;
        const cur = parseFloat(display);
        let res = 0;
        if (op === '+') res = prevVal + cur;
        if (op === '-') res = prevVal - cur;
        if (op === '*') res = prevVal * cur;
        if (op === '/') res = cur === 0 ? 'Cannot divide by zero' : prevVal / cur;
        display = typeof res === 'number' ? String(Number(res.toPrecision(12))) : res;
        prevVal = typeof res === 'number' ? res : null;
      }

      container.innerHTML = `
        <div style="background:#c0c0c0; padding:8px; flex:1; display:flex; flex-direction:column; gap:8px;">
          <div class="bevel-in" style="padding:4px 8px; text-align:right; font-family:monospace; font-size:15px; font-weight:bold; background:#fff;" id="calc-disp">0</div>
          <div style="display:flex; gap:6px; align-items:center;">
            <div class="bevel-in" style="width:28px; height:24px; background:#c0c0c0; display:flex; align-items:center; justify-content:center; font-weight:bold;" id="calc-mem-ind"></div>
            <button class="calc-btn" style="flex:1; color:#800000;" data-k="Back">Back</button>
            <button class="calc-btn" style="flex:1; color:#800000;" data-k="CE">CE</button>
            <button class="calc-btn" style="flex:1; color:#800000;" data-k="C">C</button>
          </div>
          <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:4px;">
            <button class="calc-btn" style="color:#ff0000;" data-k="MC">MC</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="7">7</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="8">8</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="9">9</button>
            <button class="calc-btn" style="color:#ff0000;" data-k="/">/</button>
            <button class="calc-btn" style="color:#000080;" data-k="sqrt">sqrt</button>

            <button class="calc-btn" style="color:#ff0000;" data-k="MR">MR</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="4">4</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="5">5</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="6">6</button>
            <button class="calc-btn" style="color:#ff0000;" data-k="*">*</button>
            <button class="calc-btn" style="color:#000080;" data-k="%">%</button>

            <button class="calc-btn" style="color:#ff0000;" data-k="MS">MS</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="1">1</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="2">2</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="3">3</button>
            <button class="calc-btn" style="color:#ff0000;" data-k="-">-</button>
            <button class="calc-btn" style="color:#000080;" data-k="1/x">1/x</button>

            <button class="calc-btn" style="color:#ff0000;" data-k="M+">M+</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="0">0</button>
            <button class="calc-btn" style="color:#0000ff;" data-k="+/-">+/-</button>
            <button class="calc-btn" style="color:#0000ff;" data-k=".">.</button>
            <button class="calc-btn" style="color:#ff0000;" data-k="+">+</button>
            <button class="calc-btn" style="color:#ff0000;" data-k="=">=</button>
          </div>
        </div>
      `;

      container.querySelectorAll('.calc-btn').forEach(b => {
        b.onclick = () => pressKey(b.dataset.k);
      });
    }
  });
}

   14. MS-DOS PROMPT (COMMAND.COM)
   ============================================================================ */
function openDosPrompt() {
  let cwd = 'C:\\WINDOWS';

  createWindow({
    title: 'MS-DOS Prompt',
    icon: 'dos',
    width: 500,
    height: 320,
    render: (container, winObj) => {
      container.innerHTML = `
        <div id="${winObj.id}_term" style="flex:1; background:#000000; color:#c0c0c0; font-family:var(--mono-font); font-size:17px; padding:8px; overflow-y:auto; display:flex; flex-direction:column; cursor:text;">
          <div id="${winObj.id}_out" style="white-space:pre-wrap; line-height:1.2;">Microsoft(R) Windows for Workgroups 3.11\n   (C)Copyright Microsoft Corp 1985-1993.\n\nType HELP for available MS-DOS commands.\n\n</div>
          <div style="display:flex; align-items:center;">
            <span id="${winObj.id}_prompt">${cwd}&gt;</span>
            <input type="text" id="${winObj.id}_in" autocomplete="off" spellcheck="false"
                   style="flex:1; background:transparent; border:none; outline:none; color:#c0c0c0; font-family:var(--mono-font); font-size:17px; user-select:text; -webkit-user-select:text;">
          </div>
        </div>
      `;

      const term = document.getElementById(winObj.id + '_term');
      const out = document.getElementById(winObj.id + '_out');
      const promptSpan = document.getElementById(winObj.id + '_prompt');
      const inp = document.getElementById(winObj.id + '_in');

      term.onclick = () => inp.focus();
      setTimeout(() => inp.focus(), 40);

      function printLine(txt) {
        out.textContent += txt + '\n';
        term.scrollTop = term.scrollHeight;
      }

      inp.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        const raw = inp.value;
        inp.value = '';
        printLine(`${cwd}>${raw}`);
        const parts = raw.trim().split(/\s+/);
        const cmd = (parts[0] || '').toUpperCase();
        const arg = parts.slice(1).join(' ');

        if (!cmd) return;

        if (cmd === 'HELP') {
          printLine('Supported MS-DOS 6.22 Commands:\n  DIR      Displays a list of files and subdirectories.\n  CD       Displays the name of or changes the current directory.\n  TYPE     Displays the contents of a text file.\n  CLS      Clears the screen.\n  VER      Displays the MS-DOS version.\n  MEM      Displays the amount of used and free memory.\n  DATE     Displays current date.\n  TIME     Displays current system time.\n  TREE     Graphically displays the directory structure.\n  ECHO     Displays messages.\n  WIN      Switches to Windows Program Manager.\n  EXIT     Quits the MS-DOS command interpreter.');
        } else if (cmd === 'CLS') {
          out.textContent = '';
        } else if (cmd === 'VER') {
          printLine('\nMS-DOS Version 6.22\n');
        } else if (cmd === 'DATE') {
          printLine('Current date is ' + new Date().toDateString());
        } else if (cmd === 'TIME') {
          printLine('Current time is ' + new Date().toLocaleTimeString());
        } else if (cmd === 'ECHO') {
          printLine(arg);
        } else if (cmd === 'MEM') {
          printLine('\nMemory Type        Total  =   Used  +   Free\n----------------  -------   -------   -------\nConventional         640K       48K      592K\nUpper                128K       84K       44K\nExtended (XMS)    15,616K    2,048K   13,568K\n----------------  -------   -------   -------\nTotal memory      16,384K    2,180K   14,204K\n');
        } else if (cmd === 'TREE') {
          printLine('Directory PATH listing for Volume MS-DOS_6\nC:\\\n├───DOS\n├───WINDOWS\n│   └───SYSTEM\n└───WORK\n');
        } else if (cmd === 'DIR') {
          const dirObj = virtualFS[cwd];
          printLine(`\n Volume in drive C is MS-DOS_6\n Directory of ${cwd}\n`);
          if (cwd !== 'C:\\') printLine('.            <DIR>         11-01-93  3:11a\n..           <DIR>         11-01-93  3:11a');
          Object.keys(virtualFS).forEach(d => {
            if (d !== cwd && d.startsWith(cwd === 'C:\\' ? 'C:\\' : cwd + '\\')) {
              const sub = d.substring(cwd === 'C:\\' ? 3 : cwd.length + 1);
              if (!sub.includes('\\')) {
                printLine(`${sub.padEnd(12)} <DIR>         11-01-93  3:11a`);
              }
            }
          });
          if (dirObj) {
            dirObj.files.forEach(f => {
              printLine(`${f.name.padEnd(13)} ${String(f.size).padStart(10)} ${f.date}`);
            });
            printLine(`        ${dirObj.files.length} file(s)    124,518,400 bytes free\n`);
          }
        } else if (cmd === 'CD' || cmd === 'CHDIR') {
          if (!arg) {
            printLine(cwd);
          } else if (arg === '\\' || arg === '/') {
            cwd = 'C:\\';
          } else if (arg === '..') {
            if (cwd !== 'C:\\') {
              const idx = cwd.lastIndexOf('\\');
              cwd = idx <= 2 ? 'C:\\' : cwd.substring(0, idx);
            }
          } else {
            const target = arg.toUpperCase().startsWith('C:\\')
              ? arg.toUpperCase()
              : (cwd === 'C:\\' ? 'C:\\' + arg.toUpperCase() : cwd + '\\' + arg.toUpperCase());
            if (virtualFS[target]) {
              cwd = target;
            } else {
              printLine('Invalid directory');
            }
          }
          promptSpan.textContent = `${cwd}>`;
        } else if (cmd === 'TYPE') {
          const dirObj = virtualFS[cwd];
          const f = dirObj ? dirObj.files.find(x => x.name.toUpperCase() === arg.toUpperCase()) : null;
          if (f && f.content) printLine('\n' + f.content);
          else printLine('File not found - ' + arg);
        } else if (cmd === 'WIN') {
          openProgramManager();
        } else if (cmd === 'EXIT') {
          closeWindow(winObj.id);
        } else {
          printLine('Bad command or file name');
        }
      };
    }
  });
}

const colorSchemes = {

  'Hotdog Stand': { desktop: '#ffff00', activeTitle: '#000000', activeText: '#ffffff', winBg: '#ff0000' },

function applyColorScheme(name) {
  const s = colorSchemes[name];

  const r = document.documentElement.style;

  r.setProperty('--title-active-bg', s.activeTitle);

  r.setProperty('--win-bg', s.winBg);
}

function openClock() {
  let mode = 'analog';
  let timer = null;

  createWindow({
    singletonId: 'clock',
    title: 'Clock',
    icon: 'clock',
    width: 210,
    height: 235,
    onClose: () => { if (timer) clearInterval(timer); },
    menus: [
      {
        label: '&Settings',
        items: [
          { label: 'Analog', action: () => { mode = 'analog'; drawClock(); } },
          { label: 'Digital', action: () => { mode = 'digital'; drawClock(); } }
        ]
      }
    ],
    render: (container) => {
      container.innerHTML = `<div id="clock-body" style="flex:1; background:#c0c0c0; display:flex; align-items:center; justify-content:center; padding:8px;"></div>`;
      const body = container.querySelector('#clock-body');

      function drawClock() {
        const now = new Date();
        if (mode === 'digital') {
          body.innerHTML = `
            <div style="text-align:center;">
              <div style="font-family:var(--mono-font); font-size:34px; font-weight:bold; color:#000080;">${now.toLocaleTimeString()}</div>
              <div style="font-size:12px; margin-top:4px;">${now.toLocaleDateString()}</div>
            </div>
          `;
        } else {
          const sec = now.getSeconds() * 6;
          const min = now.getMinutes() * 6 + now.getSeconds() * 0.1;
          const hr = (now.getHours() % 12) * 30 + now.getMinutes() * 0.5;
          body.innerHTML = `
            <svg width="145" height="145" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="54" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
              ${Array.from({length:12}, (_, i) => {
                const a = (i * 30) * Math.PI / 180;
                const x1 = 60 + Math.sin(a) * 44;
                const y1 = 60 - Math.cos(a) * 44;
                return `<rect x="${x1-2}" y="${y1-2}" width="4" height="4" fill="#008080"/>`;
              }).join('')}
              <line x1="60" y1="60" x2="${60 + Math.sin(hr*Math.PI/180)*28}" y2="${60 - Math.cos(hr*Math.PI/180)*28}" stroke="#000" stroke-width="3.5"/>
              <line x1="60" y1="60" x2="${60 + Math.sin(min*Math.PI/180)*40}" y2="${60 - Math.cos(min*Math.PI/180)*40}" stroke="#000" stroke-width="2.5"/>
              <line x1="60" y1="60" x2="${60 + Math.sin(sec*Math.PI/180)*44}" y2="${60 - Math.cos(sec*Math.PI/180)*44}" stroke="#ff0000" stroke-width="1.2"/>
              <circle cx="60" cy="60" r="3" fill="#000"/>
            </svg>
          `;
        }
      }

      drawClock();
      timer = setInterval(drawClock, 1000);
    }
  });
}

function openWinPopup() {
  const messages = [
    { from: 'ALICETWO', time: '10:14 AM', text: 'Welcome to WORKGROUP! File sharing is active on \\\\ALICETWO\\PUBLIC.' }
  ];

  createWindow({
    singletonId: 'winpopup',
    title: 'WinPopup - WFW-PC01',
    icon: 'winpopup',
    width: 390,
    height: 270,
    menus: [
      {
        label: '&Messages',
        items: [
          { label: 'Send...', shortcut: 'Ctrl+S', action: () => promptWinPopupSend() },
          { label: 'Clear All', action: () => { messages.length = 0; renderPopup(); } },
          { sep: true },
          { label: 'Exit', action: (w) => closeWindow(w.id) }
        ]
      },
      {
        label: '&Help',
        items: [
          { label: 'About WinPopup...', action: () => showAboutDialog('WinPopup') }
        ]
      }
    ],
    render: (container) => {
      window.renderPopup = () => {
        const msg = messages[messages.length - 1];
        container.innerHTML = `
          <div style="background:#c0c0c0; padding:6px; border-bottom:1px solid #000; display:flex; gap:8px; align-items:center;">
            <button class="win-btn" onclick="promptWinPopupSend()">✉️ Send Message</button>
            <span style="font-size:11px;">Messages: ${messages.length}</span>
          </div>
          <div style="flex:1; padding:10px; background:#c0c0c0; display:flex; flex-direction:column; gap:6px;">
            <div style="font-size:11px;">
              ${msg ? `From <b>${msg.from}</b> to <b>WFW-PC01</b> at ${msg.time}:` : 'No unread messages in queue.'}
            </div>
            <div class="bevel-in" style="flex:1; padding:8px; background:#fff; font-family:var(--sys-font); font-size:12px; overflow-y:auto;">
              ${msg ? msg.text : ''}
            </div>
          </div>
        `;
      };

      window.promptWinPopupSend = () => {
        showModal('Send Message', `
          <div style="min-width:270px; display:flex; flex-direction:column; gap:8px;">
            <div>
              <label>To Workgroup / Computer:</label>
              <select id="wp-to" class="bevel-in" style="width:100%; padding:2px;">
                <option value="WORKGROUP">WORKGROUP (Broadcast)</option>
                <option value="ALICETWO">ALICETWO</option>
                <option value="SHED-PC">SHED-PC</option>
              </select>
            </div>
            <div>
              <label>Message:</label>
              <textarea id="wp-msg" rows="3" class="bevel-in" style="width:100%; padding:4px; font-family:var(--sys-font); user-select:text; -webkit-user-select:text;">Hello from Windows for Workgroups 3.11!</textarea>
            </div>
          </div>
        `, [
          { label: 'OK', primary: true, action: () => {
            const to = document.getElementById('wp-to').value;
            const text = document.getElementById('wp-msg').value.trim();
            if (text) {
              playRetroSound('ding');
              setTimeout(() => {
                playRetroSound('chimes');
                messages.push({
                  from: to === 'WORKGROUP' ? 'SHED-PC' : to,
                  time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                  text: `Reply to "${text}": Loud and clear over NetBEUI!`
                });
                renderPopup();
              }, 700);
            }
          }},
          { label: 'Cancel' }
        ]);
      };

      renderPopup();
    }
  });
}

/* ============================================================================
   19. INITIALIZATION & KEYBOARD SHORTCUTS
   ============================================================================ */
function initDesktop() {
  openProgramManager();
}

window.addEventListener('keydown', (e) => {
  // ESC skips boot
  if (e.key === 'Escape' && document.getElementById('boot-screen').style.display !== 'none') {
    skipBoot();
    return;
  }
  // Ctrl+Esc opens Task List
  if (e.ctrlKey && e.key === 'Escape') {
    e.preventDefault();
    openTaskList();
  }
  // Alt+F4 closes active window
  if (e.altKey && e.key === 'F4') {
    e.preventDefault();
    if (activeWindowId) closeWindow(activeWindowId);
  }
});

window.onload = function() {
  startBootSequence();
};
</script>
